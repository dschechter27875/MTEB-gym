[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "mteb-gym"
version = "0.1.0"
description = "AlpacaEval-style offline arena for embedding models"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.9"

dependencies = [
    "numpy>=1.24",
    "tqdm>=4.64",
]

[project.optional-dependencies]
full = [
    "mteb>=2.0",
    "sentence-transformers>=2.7",
    "anthropic>=0.28",
    "openai>=1.0",
    "litellm>=1.0",
    "tqdm>=4.64",
]
dev = [
    "pytest>=7.0",
    "pytest-mock>=3.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["gym*"]
